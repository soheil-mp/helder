# Interim Ruff settings for scripts and examples; moves into pyproject.toml with the workspace (M0.5).
line-length = 100
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "D203",   # one-blank-line-before-class (incompatible with D211)
  "D213",   # multi-line-summary-second-line (incompatible with D212)
  "T201",   # print is the interface of scripts and examples
  "CPY001", # the licence is in LICENSE; no per-file headers
]

[lint.per-file-ignores]
"scripts/*" = ["S603", "S607"] # subprocess calls to gh with fixed arguments
