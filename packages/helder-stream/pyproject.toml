[project]
name = "helder-stream"
version = "0.1.0"
description = "Quix Streams applications: real-time quality control and the lake writer."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "helder-core",
    "helder-qc",
    "helder-lake",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
