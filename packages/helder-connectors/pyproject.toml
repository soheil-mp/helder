[project]
name = "helder-connectors"
version = "0.0.0"
description = "Source connectors for Rijkswaterstaat, RIVM, EEA, PDOK, BRO, PEGELONLINE and Open-Meteo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "helder-core",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
