[project]
name = "helder-pipelines"
version = "0.0.0"
description = "Dagster definitions: assets, asset checks, schedules and sensors."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "helder-core",
    "helder-connectors",
    "helder-lake",
    "helder-qc",
    "helder-norms",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
