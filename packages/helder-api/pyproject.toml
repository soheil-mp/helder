[project]
name = "helder-api"
version = "0.1.0"
description = "FastAPI service for Helder's derived products."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "helder-core",
    "helder-lake",
    "helder-norms",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
