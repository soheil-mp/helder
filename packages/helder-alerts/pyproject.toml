[project]
name = "helder-alerts"
version = "0.0.0"
description = "Alert engine: rules, state machines, CAP 1.2 messages, CloudEvents and ntfy."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "helder-core",
    "helder-norms",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
