name: Spike
description: A time-boxed investigation that ends in a written answer.
labels: [type:spike]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The one question this spike must answer.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why the answer matters, related roadmap items, ADRs and sources.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box (hours)
      placeholder: "4"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: For example an ADR, a measurement in docs/research, or a decision in ROADMAP.md.
    validations:
      required: true
