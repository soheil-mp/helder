name: Bug
description: Something in Helder does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, configuration, station or series IDs, and time windows. No secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion and connectors
        - Streaming and quality control
        - Lakehouse, orchestration and dbt
        - Norms and assessments
        - API, SensorThings or alerts
        - Dashboard
        - Deployment and operations
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant output, trimmed. Remove anything private.
      render: text
